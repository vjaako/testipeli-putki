<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Testipeli v0.2</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: #121212;
      color: #ffffff;
      font-family: sans-serif;
      user-select: none;
      gap: 16px;
    }
    .label {
      letter-spacing: 2px;
      color: #9e9e9e;
      font-size: 0.9rem;
    }
    #score {
      font-size: 4rem;
      font-weight: bold;
      margin-bottom: 12px;
    }
    button {
      padding: 24px 48px;
      font-size: 1.5rem;
      font-weight: bold;
      background-color: #00e676;
      color: #121212;
      border: none;
      border-radius: 16px;
      cursor: pointer;
    }
    button:active {
      transform: scale(0.95);
    }
    #resetBtn {
      margin-top: 16px;
      padding: 10px 20px;
      font-size: 0.95rem;
      background-color: transparent;
      color: #bdbdbd;
      border: 1px solid #424242;
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <div class="label">PISTEET</div>
  <div id="score">0</div>
  <button id="tapBtn">NAPAUTA</button>
  <button id="resetBtn">Nollaa</button>

  <script>
    let score = Number(localStorage.getItem('testipeli_score')) || 0;
    const scoreEl = document.getElementById('score');
    const tapBtn = document.getElementById('tapBtn');
    const resetBtn = document.getElementById('resetBtn');

    scoreEl.textContent = score;

    tapBtn.addEventListener('click', () => {
      score++;
      scoreEl.textContent = score;
      localStorage.setItem('testipeli_score', score);
    });

    resetBtn.addEventListener('click', () => {
      score = 0;
      scoreEl.textContent = score;
      localStorage.setItem('testipeli_score', score);
    });
  </script>
</body>
</html>
